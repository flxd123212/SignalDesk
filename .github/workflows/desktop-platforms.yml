name: Desktop Platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package: win
          - os: ubuntu-24.04
            package: linux
          - os: macos-15
            package: mac
          - os: macos-15-intel
            package: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libudev-dev libsecret-1-0 libfuse2t64 fonts-noto-cjk xvfb
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: runner.os != 'Windows'
      - name: Workspace and platform UI regression
        env:
          SIGNALDESK_BROWSER_CHANNEL: ${{ runner.os == 'Windows' && 'msedge' || '' }}
        run: npx playwright test tests/ui/workspaces-hardware.spec.ts tests/ui/platform.spec.ts
      - name: Desktop smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:platform-desktop
      - name: Desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:platform-desktop
      - run: npm run package:${{ matrix.package }}
      - name: Configure unpacked Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Verify packaged native bindings and application
        if: runner.os != 'Linux'
        env:
          SIGNALDESK_TEST_PACKAGED: '1'
        run: npm run test:platform-desktop
      - name: Verify Linux unpacked application
        if: runner.os == 'Linux'
        env:
          SIGNALDESK_TEST_PACKAGED: '1'
        run: xvfb-run -a npm run test:platform-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: SignalDesk-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            artifacts/
            test-results/

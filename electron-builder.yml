appId: com.signaldesk.workbench
productName: SignalDesk
directories:
  output: release
  buildResources: desktop/assets
electronDist: node_modules/electron/dist
asar: false
npmRebuild: false
files:
  - dist/**/*
  - server/**/*
  - shared/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/resources.cjs
  - desktop/appearance.cjs
  - desktop/platform.cjs
  - desktop/assets/icon.ico
  - desktop/assets/icon.png
  - package.json
extraResources:
  - from: firmware-examples
    to: firmware-examples
    filter:
      - '**/*'
      - '!**/build/**'
      - '!**/.signaldesk*/**'
win:
  icon: desktop/assets/icon.ico
  executableName: SignalDesk
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: SignalDesk-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SignalDesk
  uninstallDisplayName: SignalDesk
  installerLanguages: [zh_CN, en_US]
  language: '2052'
  runAfterFinish: false
  deleteAppDataOnUninstall: false
portable:
  artifactName: SignalDesk-Portable-${version}-${arch}.${ext}
mac:
  icon: desktop/assets/icon.png
  category: public.app-category.developer-tools
  artifactName: SignalDesk-${version}-mac-${arch}.${ext}
  target: [dmg, zip]
linux:
  icon: desktop/assets/icon.png
  executableName: signaldesk
  category: Development
  maintainer: SignalDesk
  artifactName: SignalDesk-${version}-linux-${arch}.${ext}
  target: [AppImage, deb]
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
